name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.1.0) - created if it does not already exist'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: Build mod jars
        run: ./gradlew build --stacktrace

      - name: Generate checksums
        # The server's self-updater (SelfUpdateChecker) downloads a jar straight from this release
        # and needs a hash to verify it against - GitHub's release API doesn't hand back file
        # hashes itself, so this repo has to publish its own. Only basenames go in, matching the
        # asset names softprops/action-gh-release publishes below (it drops the directory part too).
        run: |
          : > checksums.txt
          (cd loader/forge-1.20.1/build/libs && sha256sum *.jar) >> "$GITHUB_WORKSPACE/checksums.txt"
          (cd loader/neoforge-1.21.1/build/libs && sha256sum *.jar) >> "$GITHUB_WORKSPACE/checksums.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name is the tag itself. On a manual workflow_dispatch run
          # (e.g. from a repo where tag-push is restricted by a tag protection rule), this action
          # creates the tag from the provided input if it doesn't already exist.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            loader/forge-1.20.1/build/libs/*.jar
            loader/neoforge-1.21.1/build/libs/*.jar
            checksums.txt
