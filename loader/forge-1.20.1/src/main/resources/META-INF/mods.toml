modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/Daeden-JL/server-syncificator/issues"

[[mods]]
modId = "daedens_server_syncificator"
version = "${file.jarVersion}"
displayName = "Daeden's Server Syncificator"
authors = "Plugin Sync Contributors"
description = '''Keeps a client's mods folder in sync with a configured server before it connects, downloading changes from Modrinth or directly from the server and restarting to apply them.'''

[[dependencies.daedens_server_syncificator]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.daedens_server_syncificator]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.20.2)"
    ordering = "NONE"
    side = "BOTH"
