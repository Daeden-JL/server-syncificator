// NOTE: This module requires ForgeGradle, which resolves artifacts from
// files.minecraftforge.net / maven.minecraftforge.net and Mojang's piston-meta service. It is not
// wired into the root settings.gradle.kts by default because those hosts are unreachable from
// some sandboxed build environments. Add `include("loader:forge-1.20.1")` to the root
// settings.gradle.kts and run from a machine with normal internet access. See
// docs/ADDING_A_LOADER_VERSION.md.

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '0.1.6'
group = 'dev.pluginsync.loader.forge'

base {
    archivesName = 'daedens-server-syncificator-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                daedens_server_syncificator {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                daedens_server_syncificator {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation project(':sync-core')
}

// Gson ships with Minecraft/Forge itself at runtime - don't shade a second copy into the mod jar.
configurations.implementation {
    exclude group: 'com.google.code.gson', module: 'gson'
}

// `implementation project(':sync-core')` only puts sync-core on the compile/dev-run classpath - it
// does not package it. Without this, the shipped jar loads (its mods.toml is valid) and then dies
// with NoClassDefFoundError on the first dev.pluginsync.core.* reference, while `runClient` works
// fine because Gradle puts sync-core on the classpath there. Fold the classes into the mod jar.
// evaluationDependsOn: the root build sets org.gradle.configureondemand, so :sync-core isn't
// guaranteed to be configured when this file is evaluated - without this its sourceSets resolve
// to nothing and the `from` below silently contributes zero classes.
evaluationDependsOn(':sync-core')

jar {
    from project(':sync-core').sourceSets.main.output

    // mods.toml's version = "${file.jarVersion}" only resolves against this manifest attribute -
    // without it, Forge falls back to an unparseable placeholder that ServerSelfUpdateScheduler's
    // version comparison reads as "0.0.0", making every real release look newer than whatever is
    // actually running and triggering a redundant re-download on every single server startup, not
    // just when an update genuinely exists.
    manifest {
        attributes(['Implementation-Version': project.version])
    }
}
