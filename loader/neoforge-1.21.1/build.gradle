// NOTE: This module requires the NeoForge ModDev Gradle plugin, which resolves artifacts from
// maven.neoforged.net and Mojang's piston-meta service. It is not wired into the root
// settings.gradle.kts by default because those hosts are unreachable from some sandboxed build
// environments. Add `include("loader:neoforge-1.21.1")` to the root settings.gradle.kts and run
// from a machine with normal internet access. See docs/ADDING_A_LOADER_VERSION.md.

plugins {
    id 'net.neoforged.moddev' version '2.0.+'
}

version = '0.1.7'
group = 'dev.pluginsync.loader.neoforge'

base {
    archivesName = 'daedens-server-syncificator-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge's ModDev plugin fetches this exact artifact by URL rather than resolving it as a
    // normal Gradle dependency, so a "+"/range version doesn't work here - it needs a concrete
    // build number. Pinned to match the target test server (SnowGlobe, running 21.1.233).
    // Override locally with -PneoForgeVersion=... if you need to build against a different build.
    version = project.findProperty('neoForgeVersion') ?: '21.1.238'

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        daedens_server_syncificator {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':sync-core')
    // `implementation` alone doesn't reach the generated run classpath, so dev runs would fail with
    // NoClassDefFoundError on dev.pluginsync.core.* even though the shipped jar bundles it below.
    // The gson exclusion is per-dependency on purpose: sync-core asks for 2.11.0 while Minecraft
    // pins it 'strictly 2.10.1' (unresolvable), but excluding gson from the whole configuration
    // strips Minecraft's own copy and the launcher then dies on GsonBuilder before mods load.
    additionalRuntimeClasspath(project(':sync-core')) {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
}

// Gson ships with Minecraft/NeoForge itself at runtime - don't shade a second copy into the mod jar.
configurations.implementation {
    exclude group: 'com.google.code.gson', module: 'gson'
}

// `implementation project(':sync-core')` only puts sync-core on the compile/dev-run classpath - it
// does not package it. Without this, the shipped jar loads (its neoforge.mods.toml is valid) and
// then dies with NoClassDefFoundError on the first dev.pluginsync.core.* reference, while
// `runClient` works fine because Gradle puts sync-core on the classpath there.
// evaluationDependsOn: the root build sets org.gradle.configureondemand, so :sync-core isn't
// guaranteed to be configured when this file is evaluated - without this its sourceSets resolve
// to nothing and the `from` below silently contributes zero classes.
evaluationDependsOn(':sync-core')

jar {
    from project(':sync-core').sourceSets.main.output

    // neoforge.mods.toml's version = "${file.jarVersion}" only resolves against this manifest
    // attribute - without it, NeoForge falls back to an unparseable placeholder that
    // ServerSelfUpdateScheduler's version comparison reads as "0.0.0", making every real release
    // look newer than whatever is actually running and triggering a redundant re-download on
    // every single server startup, not just when an update genuinely exists.
    manifest {
        attributes(['Implementation-Version': project.version])
    }
}
