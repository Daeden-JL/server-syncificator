# Only configures the subprojects relevant to the requested tasks, instead of eagerly configuring
# every subproject in the build. Without this, even `./gradlew :sync-core:test` would try (and, in
# environments without access to Mojang/Forge/NeoForge Maven, fail) to resolve the loader modules'
# ForgeGradle/NeoForge ModDev plugins, since their build scripts would get evaluated regardless of
# which task was actually requested.
org.gradle.configureondemand=true
